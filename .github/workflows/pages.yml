---

name: Publish site

on:
  push:
    branches: [main]
  schedule:
    # Daily, so versions and support status stay current
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: v0.76.2

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Trivy
        run: |
          curl -sSL "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${TRIVY_VERSION#v}_Linux-64bit.tar.gz" | tar xz -C /usr/local/bin trivy
          trivy --version

      - name: Scan the AWX and Belfry images
        run: python scan.py

      - uses: actions/upload-artifact@v4
        with:
          name: scan-summary
          path: scan-summary.json
          retention-days: 7

  product-docs:
    # The Belfry manual (Sphinx, from belfry docs/docsite) and the operator
    # reference (MkDocs, from belfry-operator docs/), built from their main
    # branches and published under /docs/belfry/ and /docs/operator/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: belfry-project/belfry
          path: belfry
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: belfry-project/belfry-operator
          path: belfry-operator
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build the Belfry manual
        working-directory: belfry
        run: |
          python -m venv "$RUNNER_TEMP/sphinx"
          "$RUNNER_TEMP/sphinx/bin/pip" install -r docs/docsite/requirements.in -c docs/docsite/requirements.txt
          "$RUNNER_TEMP/sphinx/bin/python" docs/docsite/download-json.py
          "$RUNNER_TEMP/sphinx/bin/sphinx-build" -T -E -W -n --keep-going -j auto -c docs/docsite -b html docs/docsite/rst ../product-docs/belfry

      - name: Build the operator reference
        working-directory: belfry-operator
        run: |
          python -m venv "$RUNNER_TEMP/mkdocs"
          "$RUNNER_TEMP/mkdocs/bin/pip" install -r docs/requirements.txt
          "$RUNNER_TEMP/mkdocs/bin/mkdocs" build --strict -d ../product-docs/operator

      - uses: actions/upload-artifact@v4
        with:
          name: product-docs
          path: product-docs
          retention-days: 7

  build:
    needs: [scan, product-docs]
    # Publish the site even if the scan or the product docs failed; it then has
    # no vulnerability section, or no /docs/belfry/ and /docs/operator/
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: scan-summary

      - name: Build the comparison page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install pyyaml
          python build.py

      - name: Build the guides
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python -m pip install -r requirements-docs.txt
          mkdocs build --strict

      # After the guides: mkdocs build empties _site/docs first
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: product-docs
          path: _site/docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
