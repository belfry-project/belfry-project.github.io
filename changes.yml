# Changes in Belfry compared with the last AWX release.
#
# Each change has a title, a short explanation for users, and links to the
# pull requests that made it. Keep the explanation about the effect for users,
# not about the implementation. Newest changes first within a category.

categories:
  - id: features
    title: New features
  - id: upgrade
    title: Upgrading from AWX
  - id: support
    title: Supported software instead of end-of-life versions
  - id: fixes
    title: Fixes
  - id: build
    title: Builds and distribution
  - id: independence
    title: Independent of Red Hat infrastructure

changes:
  - category: features
    title: Save a direct playbook run as a job template
    unreleased: true
    description: >-
      A job that ran a playbook directly from a project can be saved as a job template,
      for example to schedule it: with the "Save as job template" action on the job page,
      the API (POST /api/v2/jobs/ID/create_job_template/) or the awx CLI (awx jobs
      create_job_template). The template gets the job's playbook, inventory, credentials,
      instance groups, variables and settings. Relaunching such a job now also keeps the
      instance groups it was started with.
    links:
      - belfry-project/belfry#65
      - belfry-project/belfry-ui#28
    urls:
      - title: Documentation
        url: https://belfry-project.github.io/docs/belfry/rest_api/launch_playbook.html

  - category: features
    title: Web UI for running playbooks, fact search and the host overview
    description: >-
      The web UI uses the new API features. Projects have a Run playbook action that runs
      a playbook of the project with an inventory, credentials, limit, extra variables and
      the other job options, and opens the job output. The hosts lists can be filtered by
      facts with the new operators (Filter by facts builds the condition), the filter is
      kept in the URL so it can be shared, and the smart inventory form can add fact
      conditions. Hosts have an Overview tab with their facts (searchable), groups,
      variables, the last result per job template and recent jobs. The help menu links
      to the API explorer.
    links:
      - belfry-project/belfry-ui#22
      - belfry-project/belfry-ui#23
      - belfry-project/belfry-ui#24
      - belfry-project/belfry-ui#21
      - belfry-project/belfry#61

  - category: fixes
    title: Project and template pages open again
    description: >-
      The project, job template, workflow job template and management job pages showed a
      Bad Request error instead of their details, because the web UI asked the API for
      notification admin organizations with an old role name that the new RBAC rejects.
      They now ask with the matching permission.
    links:
      - belfry-project/belfry-ui#26

  - category: features
    title: Host overview in one API call
    description: >-
      GET /api/v2/hosts/{id}/overview/ returns a host with its variables, its direct and
      inherited groups, its facts (all or selected ones), the last job of every job
      template that ran on it and its most recent jobs and ad hoc commands, for anyone
      who can read the host. The awx.awx collection has a host_overview module and the
      awx CLI an "awx hosts overview" command for it.
    links:
      - belfry-project/belfry#59
    urls:
      - title: Host overview
        url: https://belfry-project.github.io/docs/belfry/rest_api/host_overview.html

  - category: features
    title: Search hosts by facts with operators
    description: >-
      Host filters and smart inventories could only match a fact exactly. They now
      support operators on facts: case-insensitive and partial text matches
      (icontains, startswith, endswith, ...), a list of values (in), missing or present
      facts (isnull, exists), numeric comparisons (gt, gte, lt, lte) and version
      comparisons (vgte=9.2 matches 9.2 and 9.10 but not 9.1), for example
      ansible_facts__ansible_distribution_version__vgte=9.2. PostgreSQL evaluates them.
    links:
      - belfry-project/belfry#57
    urls:
      - title: Searching hosts by facts
        url: https://belfry-project.github.io/docs/belfry/rest_api/fact_search.html

  - category: features
    title: Run a playbook directly from a project
    description: >-
      A playbook of a project can be run without creating a job template first, through
      the API (POST /api/v2/projects/ID/launch_playbook/), the awx.awx.playbook_launch
      module and the awx CLI (awx projects launch_playbook). The run is a normal job with
      output, events, cancel and relaunch. It needs the same permissions as creating a job
      template from the same project, inventory and credentials. Administrators can turn
      it off with the ALLOW_DIRECT_PLAYBOOK_LAUNCH setting.
    links:
      - belfry-project/belfry#58
    urls:
      - title: Documentation
        url: https://belfry-project.github.io/docs/belfry/rest_api/launch_playbook.html

  - category: features
    title: API explorer on every instance and a browsable API reference
    description: >-
      Every Belfry instance has an interactive API explorer at /api/v2/docs/ (Swagger UI,
      and ReDoc at /api/v2/docs/redoc/). "Try it out" sends requests with your browser
      session or with a username and password under "Authorize", with your own
      permissions. Swagger UI and ReDoc are served by Belfry itself instead of being
      loaded from a CDN, and credentials are not stored in the browser. The API
      reference in the manual has a filter, an index of the endpoint groups, links per
      operation and an introduction to authentication, pagination and filtering.
    links:
      - belfry-project/belfry#55
    urls:
      - title: Using the API
        url: https://belfry-project.github.io/docs/api/
      - title: API reference
        url: https://belfry-project.github.io/docs/belfry/rest_api/api_ref.html

  - category: features
    title: A modern browsable API
    description: >-
      The API pages at /api/ in a browser have a new look in the style of the web UI,
      with dark mode, a collapsible JSON view in which every API path is a link,
      breadcrumbs, the login state, links to the API explorer and the web UI, and
      clearer forms for POST, PUT, PATCH and DELETE. The pages no longer load Bootstrap
      or jQuery. API responses are unchanged.
    links:
      - belfry-project/belfry#56
    urls:
      - title: Browsable API
        url: https://belfry-project.github.io/docs/belfry/rest_api/browseable.html

  - category: upgrade
    title: Documentation for installing Belfry and migrating from AWX
    description: >-
      Step-by-step guides for people who know AWX: installing Belfry with the operator
      manifest or the Helm chart, migrating an AWX 24.6.1 installation in place (with a
      backup and a way back), upgrades, backups, execution environments and image
      verification. The AWX and AWX Operator reference documentation is published for
      Belfry next to them.
    links:
      - belfry-project/belfry#32
      - belfry-project/belfry-operator#20
    urls:
      - title: Documentation
        url: https://belfry-project.github.io/docs/
      - title: Migrating from AWX
        url: https://belfry-project.github.io/docs/migrate/

  - category: upgrade
    title: Tested upgrade and backup/restore from AWX 24.6.1
    description: >-
      An existing AWX 24.6.1 installation is upgraded by replacing awx-operator 2.19.1
      with belfry-operator on the same AWX resource. An automated test does this every
      week on a fresh Kubernetes cluster: organizations, inventories, encrypted
      credentials, projects, job templates, finished jobs with their output and cached
      facts survive, and new jobs run in Belfry's execution environment with the
      credentials created before the upgrade. The same test backs up the AWX 24.6.1
      instance with awx-operator's AWXBackup and restores that backup with
      belfry-operator's AWXRestore into a new instance, which then runs Belfry with all
      the same data. Two restore bugs it found are fixed: backup and restore pods can
      reach PostgreSQL through its NetworkPolicy, and a restore no longer leaves empty
      secrets named after the new instance.
    links:
      - belfry-project/belfry-operator#14
      - belfry-project/belfry-operator#17
      - belfry-project/belfry-operator#23
      - belfry-project/belfry-operator#25
    urls:
      - title: Latest test runs
        url: https://github.com/belfry-project/belfry-operator/actions/workflows/upgrade-test.yml

  - category: support
    title: AlmaLinux 10 and Python 3.14 for the application and execution environment
    description: >-
      AWX 24.6.1 builds its application image, execution environment and the operator's
      init-projects container on CentOS Stream 9, which reaches end of life in May 2027,
      and runs the application on Python 3.11. Belfry moves all three images to
      AlmaLinux 10, supported until May 2035, and the application to Python 3.14,
      supported until October 2030. CentOS Stream is a rolling preview of the next RHEL
      release, so its packages change before RHEL has released them, and it has no
      point releases to test against; AlmaLinux 10 is a free, stable rebuild of RHEL 10
      with point releases and security errata. It uses the same packages as RHEL, so
      teams that know RHEL or CentOS know it too, and execution environments built on
      belfry-ee install packages with dnf as before.
    links:
      - belfry-project/belfry#36
      - belfry-project/belfry-ee#16
      - belfry-project/belfry-operator#29
    urls:
      - title: Why AlmaLinux 10
        url: https://belfry-project.github.io/docs/faq/#why-almalinux

  - category: support
    title: PostgreSQL 18 for the managed database
    description: >-
      awx-operator 2.19.1 and belfry-operator 1.0.0 run the managed database on
      PostgreSQL 15, which gets fixes until November 2027. belfry-operator moves it to
      PostgreSQL 18, supported until November 2030. On the first reconciliation after
      the operator upgrade, it copies the data into a new PostgreSQL 18 database with
      pg_dump and pg_restore, on a second volume of the same size, while Belfry is scaled
      down; the old volume is kept until you delete it. External databases are not
      touched. An automated test upgrades AWX 24.6.1 and belfry-operator 1.0.0
      installations this way, and restores PostgreSQL 15 and 18 backups into PostgreSQL 18.
    links:
      - belfry-project/belfry-operator#30
      - belfry-project/belfry#37
    urls:
      - title: Upgrading to PostgreSQL 18
        url: https://belfry-project.github.io/docs/upgrade/#postgresql-18

  - category: support
    title: Django REST framework 3.18
    description: >-
      AWX 24.6.1 uses Django REST framework 3.15.1, and the AWX development branch is
      pinned to 3.15.2, which has three high severity vulnerabilities. Belfry uses
      3.18.3, with the API behaving as before: for example, an organization is still
      required when creating an inventory or a notification template.
    links:
      - belfry-project/belfry#28

  - category: support
    title: Execution environment on CentOS Stream 10, Python 3.14 and ansible-core 2.22
    description: >-
      The AWX 24.6.1 execution environment runs ansible-core 2.15, end-of-life since
      November 2024, on Python 3.9, end-of-life since October 2025. Upstream later
      pinned ansible-core below 2.19, which now resolves to the end-of-life 2.18.
      Belfry's execution environment uses current, supported versions.
    links:
      - belfry-project/belfry-ee#9
      - belfry-project/belfry#18

  - category: support
    title: UI built with Node.js 24 instead of 16
    description: >-
      AWX 24.6.1 builds its UI with Node.js 16, end-of-life since September 2023, and
      the development branch with Node.js 18, end-of-life since April 2025. Belfry
      uses Node.js 24 (LTS, supported until April 2028), set in one place.
    links:
      - belfry-project/belfry#15

  - category: support
    title: Redis 8.10
    description: >-
      AWX uses the floating Redis 7 tag, licensed under RSALv2/SSPL. Belfry pins Redis
      8.10.3, which can be used under the AGPLv3 open source license.
    links:
      - belfry-project/belfry-operator#11
      - belfry-project/belfry#19

  - category: support
    title: Current Kubernetes tooling in the operator and Helm chart
    description: >-
      kubernetes.core 6.6, kustomize 5.8 and opm 1.74 in the operator, and Helm 4.3,
      kustomize 5.8, yq 4.54 and chart-releaser 1.10 for the Helm chart, which was
      built with Helm 3.8 from 2022.
    links:
      - belfry-project/belfry-operator#8
      - belfry-project/helm-charts#7

  - category: support
    title: Upstream fixes since AWX 24.6.1 included
    description: >-
      Belfry is based on the AWX development branch, so it includes the upstream
      fixes and dependency updates made since the last AWX release, which were never
      released by the AWX project.

  - category: fixes
    title: The manual's API reference documents Belfry's API
    description: >-
      The REST API reference in the AWX manual showed a 2023 Swagger 2.0 description of
      AWX's API, downloaded from AWS S3, because its Swagger UI was too old for OpenAPI 3.
      Belfry's manual renders the OpenAPI 3 schema of the latest Belfry release with a
      current Swagger UI that is shipped with the manual, so the page loads nothing from
      other sites. The OpenAPI schema page uses Redoc 2.5 instead of Redoc 1.21 from 2019,
      also shipped with the manual.
    links:
      - belfry-project/belfry#48
      - belfry-project/belfry#63
    urls:
      - title: API reference
        url: https://belfry-project.github.io/docs/belfry/rest_api/api_ref.html

  - category: fixes
    title: Web UI dependencies updated, without high or critical advisories
    description: >-
      The web UI was built from ansible-ui as of September 2024, with dependencies that
      npm audit reported 5 critical and 36 high advisories for, among them open redirect
      and cross-site scripting issues in libraries that run in the browser (React Router,
      DOMPurify). Belfry updates the UI's dependencies to current releases within their
      major versions, and moves build and test tools (webpack plugins, Vite,
      webpack-dev-server, Cypress) to new major versions, leaving no critical or high
      advisories. React Router moves to version 7, which fixes the last advisory in
      code that runs in the browser. The UI still uses React 18 and PatternFly 5.
      Every change to the UI is now built and tested automatically.
    links:
      - belfry-project/belfry-ui#11
      - belfry-project/belfry-ui#13
      - belfry-project/belfry-ui#17
      - belfry-project/belfry-ui#18
      - belfry-project/belfry-ui#19
      - belfry-project/belfry-ui#20

  - category: fixes
    title: A restore that failed halfway can be retried
    description: >-
      A restore over a database that already has AWX's tables failed, because the
      partitioned job event tables cannot be cleaned by pg_restore. So an AWXRestore that
      failed halfway could not be retried, and restoring into an existing instance failed.
      The operator now drops and recreates the database it manages before restoring. An
      external database is only dropped and recreated with force_drop_db, as before.
      The database user gets the CREATEDB privilege only while the database is restored,
      also when the restore fails.
    links:
      - belfry-project/belfry-operator#35
      - belfry-project/belfry-operator#39

  - category: fixes
    title: Receptor and the operator base image rebuilt with security fixes
    description: >-
      AWX ships the receptor binary and builds the operator on the ansible-operator
      image as released upstream, with an old Go toolchain, vulnerable Go modules and
      outdated Python and operating system packages. Belfry rebuilds both from the same
      upstream releases with current Go, Go modules, UBI packages and Python packages,
      and rebuilds them every week. This removes all high and critical findings in
      receptor (in the execution environment and the Belfry image) and in the
      ansible-operator binary and Python packages of the operator image, including a
      critical one in certifi.
    links:
      - belfry-project/image-mirror#2
      - belfry-project/belfry-ee#15
      - belfry-project/belfry#33
      - belfry-project/belfry-operator#21

  - category: fixes
    title: The operator can be installed as published
    description: >-
      awx-operator 2.19.1, the last AWX operator release, can no longer be installed as
      published: its kube-rbac-proxy sidecar image (gcr.io/kubebuilder) no longer exists,
      so users have to replace it by hand. belfry-operator serves metrics with built-in
      authentication and needs no extra image.
    links:
      - belfry-project/belfry-operator#14

  - category: fixes
    title: Fact caching works with ansible-core 2.19 and newer
    description: >-
      ansible-core 2.19 changed how facts are cached, and AWX could not read the new
      format: jobs did not see cached facts, and facts were cleared after every job.
      This is why upstream could not move past ansible-core 2.18. Belfry reads and
      writes both formats and stores facts without internal Ansible metadata.
    links:
      - belfry-project/belfry#18

  - category: fixes
    title: Helm chart works with the current operator
    description: >-
      The operator replaced kube-rbac-proxy with built-in metrics authentication, and
      the upstream Helm chart generation failed against it. Belfry's chart is generated
      from the current operator.
    links:
      - belfry-project/helm-charts#5

  - category: build
    title: Releases on GitHub with matching versions, images, chart and packages
    description: >-
      Each Belfry release has the same version tag (for example 1.0.0, or 1.0.0-rc.1
      for a release candidate) for the application, execution environment, operator
      and Helm chart, and the operator installs the matching application and
      execution environment by default. The application reports exactly that version.
      Each release comes with an operator install manifest, the Helm chart in the
      repository https://belfry-project.github.io/helm-charts/, the awx.awx collection
      and awxkit as downloads, and for every image an SBOM and a vulnerability scan.
      ":latest" means the newest final release; release candidates never get it.
    links:
      - belfry-project/belfry#31
      - belfry-project/belfry#34
      - belfry-project/belfry-ee#14
      - belfry-project/belfry-operator#28
      - belfry-project/helm-charts#9
      - belfry-project/helm-charts#11
    urls:
      - title: Release procedure
        url: https://github.com/belfry-project/.github/blob/main/RELEASING.md

  - category: build
    title: All dependencies pinned, and updated through reviewed pull requests
    description: >-
      AWX builds install several dependencies from moving branches, so the same release
      could produce different images. Belfry pins every dependency to an exact version
      or commit. Renovate proposes updates as pull requests, which go through CI. The
      execution environment pins its base image by digest, its collections to exact
      versions and installs awxkit from the latest Belfry release.
    links:
      - belfry-project/belfry#3
      - belfry-project/belfry-ee#2
      - belfry-project/belfry-ee#19

  - category: build
    title: Multi-architecture images on GitHub Container Registry
    description: >-
      All images are published to ghcr.io/belfry-project for amd64 and arm64, built
      natively on both architectures.
    links:
      - belfry-project/belfry#11
      - belfry-project/belfry#20
      - belfry-project/belfry-ee#10
      - belfry-project/belfry-operator#5
      - belfry-project/belfry-operator#12

  - category: build
    title: Signed build provenance and SBOM for every image
    description: >-
      Every published image carries a signed attestation of the repository, commit and
      workflow that built it, and a signed SBOM listing every package in it. Anyone can
      verify them with "gh attestation verify oci://IMAGE --owner belfry-project". The
      vulnerability comparison on this page is rescanned daily.
    links:
      - belfry-project/belfry#24
      - belfry-project/belfry-ee#11
      - belfry-project/belfry-operator#15

  - category: build
    title: Execution environment changes are tested before they are published
    description: >-
      Pull requests to the execution environment publish a test image, and the Belfry
      test suite, including tests that run real jobs, can run against it before it
      becomes the default.
    links:
      - belfry-project/belfry-ee#8
      - belfry-project/belfry#16

  - category: independence
    title: Belfry name and logo instead of the AWX trademarks
    description: >-
      The web UI, the REST API browser, the error pages and the documentation show
      the Belfry name and logo. AWX's logos and mascot are no longer shipped. The
      interfaces automation depends on stay the same: API paths, the awx.awx
      collection, the awxkit CLI and the AWX resource kind in Kubernetes.
    links:
      - belfry-project/belfry#30
      - belfry-project/belfry-ui#9
      - belfry-project/belfry-ee#13
      - belfry-project/belfry-operator#18
      - belfry-project/helm-charts#8

  - category: independence
    title: Built, tested and published entirely on GitHub
    description: >-
      Belfry no longer depends on Quay, Ansible Galaxy, PyPI, SonarCloud, AWS or Red Hat's
      internal build system (Konflux) to build or release. Everything runs on GitHub
      Actions and is published to GitHub. The OpenAPI schema of each release is attached
      to its GitHub release, and pull requests are checked against the schema of their
      base branch instead of one on AWS S3.
    links:
      - belfry-project/belfry#11
      - belfry-project/belfry#43
      - belfry-project/belfry-operator#5
      - belfry-project/belfry-ee#2
